default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("STORAGE_PATH", Rails.root.join("storage")).then { |path| File.join(path, "development.sqlite3") } %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_STORAGE_PATH", Rails.root.join("storage")).then { |path| File.join(path, "test.sqlite3") } %>

production:
  <<: *default
  database: <%= ENV.fetch("STORAGE_PATH", Rails.root.join("storage")).then { |path| File.join(path, "production.sqlite3") } %>
